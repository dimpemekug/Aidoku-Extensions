<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aidoku Extensions</title>
  <meta name="description" content="Fonti Aidoku per leggere manga in italiano.">
  <link rel="icon" href="icons/it.mangaworldita-v1.png">
  <style>
    :root {
      --bg: #0a0c11;
      --card: #14171f;
      --line: #262a35;
      --text: #e6e6e6;
      --muted: #9aa0ad;
      --orange: #ee6c4d;
      --blue: #3d5a80;
      --green: #2f9e5b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px 64px; }
    header { text-align: center; }
    .logo {
      width: 96px; height: 96px; border-radius: 22px;
      box-shadow: 0 0 60px rgba(238, 108, 77, .25), 0 0 60px rgba(61, 90, 128, .35);
    }
    h1 { margin: 20px 0 4px; font-size: 28px; }
    .lead { margin: 0; color: var(--muted); }
    .buttons { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 24px; }
    .button {
      display: inline-block; padding: 10px 20px; border-radius: 999px;
      color: #fff; text-decoration: none; font-weight: 600;
      transition: filter .15s;
    }
    .button:hover { filter: brightness(1.12); }
    .aidoku { background: var(--orange); }
    .legendum { background: var(--blue); }
    .address {
      display: flex; align-items: center; gap: 8px;
      max-width: 480px; margin: 18px auto 0; padding: 4px 4px 4px 16px;
      border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, .03);
    }
    .address input {
      flex: 1; min-width: 0; border: 0; background: transparent; color: var(--muted);
      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; outline: none;
      text-overflow: ellipsis;
    }
    .address button {
      flex-shrink: 0; padding: 6px 14px; border: 0; border-radius: 999px; cursor: pointer;
      background: rgba(255, 255, 255, .12); color: #fff; font: 600 13px inherit;
      font-family: inherit;
    }
    .address button.done { background: var(--green); }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; text-align: center; }
    h2 { margin: 40px 0 12px; font-size: 18px; }
    .source {
      display: flex; gap: 14px; align-items: center;
      padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card);
    }
    .source img { width: 56px; height: 56px; border-radius: 50%; }
    .source h3 { margin: 0; font-size: 17px; }
    .source p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
    .badge {
      margin-left: auto; align-self: flex-start; padding: 2px 8px; border-radius: 6px;
      background: rgba(255, 255, 255, .08); color: var(--muted); font-size: 12px; font-weight: 600;
    }
    footer { margin-top: 48px; color: var(--muted); font-size: 12px; text-align: center; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <header>
      <img class="logo" src="icons/it.mangaworldita-v1.png" alt="">
      <h1>Aidoku Extensions</h1>
      <p class="lead">Fonti Aidoku per leggere manga in italiano.</p>

      <div class="buttons">
        <a class="button aidoku" id="add-aidoku" href="#">Aggiungi ad Aidoku</a>
        <a class="button legendum" id="add-legendum" href="#">Aggiungi a Legendum</a>
      </div>

      <div class="address">
        <input id="address" readonly aria-label="Indirizzo del repository">
        <button type="button" id="copy">Copia indirizzo</button>
      </div>
      <p class="hint">
        Per aggiungerlo a mano: in Aidoku Impostazioni › Liste di fonti › +,
        in Legendum Esplora › Aggiungi repository
      </p>
    </header>

    <h2>Fonti</h2>
    <div id="sources"></div>

    <footer>
      Fonti non ufficiali, non affiliate ai siti né ad Aidoku.
      <a href="https://github.com/dimpemekug/Aidoku-Extensions">Codice su GitHub</a>
    </footer>
  </main>

  <script>
    const listUrl = new URL("index.min.json", location.href.split(/[?#]/)[0]).href;
    document.getElementById("address").value = listUrl;
    document.getElementById("add-aidoku").href = "aidoku://addSourceList?url=" + listUrl;
    document.getElementById("add-legendum").href = "legendum://add-repo?url=" + encodeURIComponent(listUrl);

    const copy = document.getElementById("copy");
    copy.addEventListener("click", async () => {
      const field = document.getElementById("address");
      try {
        await navigator.clipboard.writeText(field.value);
      } catch {
        field.select();
        document.execCommand("copy");
      }
      copy.textContent = "Copiato ✓";
      copy.classList.add("done");
      setTimeout(() => {
        copy.textContent = "Copia indirizzo";
        copy.classList.remove("done");
      }, 2000);
    });

    const ratings = ["Per tutti", "Contiene contenuti maturi", "Per adulti"];
    fetch(listUrl)
      .then((response) => response.json())
      .then((list) => {
        const container = document.getElementById("sources");
        for (const source of list.sources) {
          const card = document.createElement("div");
          card.className = "source";
          const icon = document.createElement("img");
          icon.src = source.iconURL;
          icon.alt = "";
          const body = document.createElement("div");
          const name = document.createElement("h3");
          name.textContent = source.name;
          const detail = document.createElement("p");
          detail.textContent = `Versione ${source.version} · ${(source.languages || []).join(", ").toUpperCase()}`
            + (source.baseURL ? ` · ${new URL(source.baseURL).host}` : "");
          body.append(name, detail);
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = ratings[source.contentRating] || "";
          card.append(icon, body, badge);
          container.append(card);
        }
      })
      .catch(() => {
        document.getElementById("sources").textContent = "Non è stato possibile leggere l'elenco delle fonti.";
      });
  </script>
</body>
</html>
